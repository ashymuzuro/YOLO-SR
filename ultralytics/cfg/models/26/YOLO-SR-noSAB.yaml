# YOLO-SR ablation: RepCF ONLY (SAB removed).
# Keeps the Reparameterised Contextual Fusion (RepCF) module in the neck but
# removes the Super-Resolution Auxiliary Branch (layers 25-28 of the full model).
# With no SAB reconstruction the Structure-Aware Multi-Task Loss is inactive, so
# this config isolates component A. It is the "+A" (RepCF only) row of Table 4 and
# the "RepCF fused" row of the mechanism-isolation study (Table 5).
#
# Train:  python train_yolo_sr.py --model ultralytics/cfg/models/26/YOLO-SR-noSAB.yaml \
#             --data ultralytics/cfg/datasets/VisDrone.yaml --name abl_A_repcf

# Parameters
nc: 10
end2end: True
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]

# Backbone (identical to YOLO-SR)
backbone:
  - [-1, 1, Conv, [64, 3, 2]]  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4: P3 feature map (source for RepCF)
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6: P4 feature map
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8: P5 feature map
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# Neck with RepCF (no SAB tail)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12: cat backbone P4
  - [-1, 2, C3k2, [512, True]] # 13: Neck P4

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14: upsampled Neck P4

  - [4, 1, RepCF, [256]] # 15: route backbone P3 (layer 4) through RepCF (channel-preserving -> 128 ch)
  - [[-1, 14], 1, Concat, [1]] # 16: concat RepCF(P3) with upsampled Neck P4

  - [-1, 2, C3k2, [256, True]] # 17 (P3/8-small detection head input)

  - [-1, 1, Conv, [256, 3, 2]] # 18
  - [[-1, 13], 1, Concat, [1]] # 19: cat head P4
  - [-1, 2, C3k2, [512, True]] # 20 (P4/16-medium detection head input)

  - [-1, 1, Conv, [512, 3, 2]] # 21
  - [[-1, 10], 1, Concat, [1]] # 22: cat head P5
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 23 (P5/32-large detection head input)

  - [[17, 20, 23], 1, Detect, [nc]] # 24: Detect(P3, P4, P5)

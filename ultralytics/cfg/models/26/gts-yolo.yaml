# GTS-YOLO: Ghost-Transformer-SuperResolution
# PhD Innovation: P2-Head + Transformer(P5) + Ghost(Backbone) + SPD-Conv + Z-SRAB
nc: 80 # number of classes
scales:
  n: [0.50, 0.25, 1024]

# [REQ-01] Backbone (Ghost + SPD + Transformer)
backbone:
  # [from, repeats, module, args]
  # 0: SPD-Conv (Lossless Downsampling)
  - [-1, 1, Focus, [64, 3]] 
  
  # 1-7: GhostNet (Lightweight Feature Extraction)
  - [-1, 1, GhostConv, [128, 3, 2]] # 1-P2/4 (High Res for P2 Head)
  - [-1, 2, C3Ghost, [256]]         # 2
  - [-1, 1, GhostConv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3Ghost, [512]]         # 4
  - [-1, 1, GhostConv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3Ghost, [512]]         # 6
  - [-1, 1, GhostConv, [1024, 3, 2]]# 7-P5/32

  # 8: Transformer Block (Global Context)
  - [-1, 3, C3TR, [1024, False]]    # 8-P5
  - [-1, 1, SPPF, [1024, 5]]        # 9

# [REQ-02] Head (P2 High-Res + CARAFE/Upsample)
head:
  # Top-Down Path
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] 
  - [-1, 2, C3Ghost, [512, False]] # 12 (P4)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] 
  - [-1, 2, C3Ghost, [256, False]] # 15 (P3)

  # --- P2 EXTENSION (Tiny Object Head) ---
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 1], 1, Concat, [1]]      # Cat with Backbone Layer 1
  - [-1, 2, C3Ghost, [128, False]] # 18 (P2 - High Res)

  # Bottom-Up Path
  - [-1, 1, GhostConv, [128, 3, 2]] 
  - [[-1, 15], 1, Concat, [1]] 
  - [-1, 2, C3Ghost, [256, False]] # 21 (P3)

  - [-1, 1, GhostConv, [256, 3, 2]] 
  - [[-1, 12], 1, Concat, [1]] 
  - [-1, 2, C3Ghost, [512, False]] # 24 (P4)

  - [-1, 1, GhostConv, [512, 3, 2]] 
  - [[-1, 9], 1, Concat, [1]] 
  - [-1, 2, C3TR, [1024, False]]   # 27 (P5 - Transformer Refined)

  # Detect on 4 Scales (P2, P3, P4, P5)
  - [[18, 21, 24, 27], 1, Detect, [nc]] # 28

  # [REQ-03] Auxiliary Super-Resolution Branch (Training Only)
  # Branch from P3 (Layer 21) which contains small object features
  - [21, 1, Conv, [256, 3, 1]]   # 29: Branch
  - [-1, 1, Conv, [3, 1, 1, None, 1, 1, False]]    # 30: To RGB (No Activation for linear output)
  - [-1, 1, nn.Upsample, [None, 8, 'nearest']] # 31: Match Input (Stride 8 -> 1)
  - [-1, 1, nn.Sigmoid, []] # 32: Force Output to [0, 1] Range
# YOLO-SR ablation: PERMANENT P2 DETECTION HEAD (stride-4), no SAB / no RepCF.
# The conventional way to help tiny objects is to add a high-resolution stride-4
# (P2/4) detection head. Unlike the SAB, a P2 head is PERMANENT - it executes at
# inference and therefore raises the deployed cost. This is the "P2 detection
# head" row of the mechanism-isolation study (Table 5): it improves small-object
# accuracy but at 2.75 M params / 31.2 GFLOPs (vs 2.57 M / 24.4 for every
# zero-cost variant). Compare against "P3-SAB branch" (YOLO-SR-noRepCF.yaml),
# which reaches comparable/greater accuracy with NO deployment overhead.
#
# This is a 4-scale detector: Detect(P2/4, P3/8, P4/16, P5/32).
#
# Train:  python train_yolo_sr.py --model ultralytics/cfg/models/26/YOLO-SR-P2.yaml \
#             --data ultralytics/cfg/datasets/VisDrone.yaml --name abl_p2_head

# Parameters
nc: 10
end2end: True
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]

# Backbone (identical to YOLO-SR)
backbone:
  - [-1, 1, Conv, [64, 3, 2]]  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2: P2 feature map (stride 4)
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4: P3 feature map (stride 8)
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6: P4 feature map (stride 16)
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8: P5 feature map
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10: P5 feature map (stride 32)

# PAN-FPN neck extended down to P2/4, with a 4-scale detection head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12: cat backbone P4
  - [-1, 2, C3k2, [512, True]] # 13: Neck P4

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, Concat, [1]] # 15: cat backbone P3
  - [-1, 2, C3k2, [256, True]] # 16: Neck P3

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 17
  - [[-1, 2], 1, Concat, [1]] # 18: cat backbone P2
  - [-1, 2, C3k2, [128, True]] # 19 (P2/4-xsmall detection head input)

  - [-1, 1, Conv, [128, 3, 2]] # 20
  - [[-1, 16], 1, Concat, [1]] # 21: cat neck P3
  - [-1, 2, C3k2, [256, True]] # 22 (P3/8-small detection head input)

  - [-1, 1, Conv, [256, 3, 2]] # 23
  - [[-1, 13], 1, Concat, [1]] # 24: cat neck P4
  - [-1, 2, C3k2, [512, True]] # 25 (P4/16-medium detection head input)

  - [-1, 1, Conv, [512, 3, 2]] # 26
  - [[-1, 10], 1, Concat, [1]] # 27: cat backbone P5
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 28 (P5/32-large detection head input)

  - [[19, 22, 25, 28], 1, Detect, [nc]] # 29: Detect(P2, P3, P4, P5)

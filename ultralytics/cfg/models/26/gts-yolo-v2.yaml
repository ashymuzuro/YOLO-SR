# GTS-YOLO v2 🚀
# Innovations: Ghost-Net + Transformer + P2-Head + SimAM + WeightedFusion + HFIM

nc: 10 # number of classes
scales:
  n: [0.50, 0.25, 1024]

# Backbone (Unchanged - It works well)
backbone:
  - [-1, 1, Focus, [64, 3]]           # 0-P1/2
  - [-1, 1, GhostConv, [128, 3, 2]]   # 1-P2/4
  - [-1, 2, C3Ghost, [256]]           # 2
  - [-1, 1, GhostConv, [256, 3, 2]]   # 3-P3/8
  - [-1, 2, C3Ghost, [512]]           # 4
  - [-1, 1, GhostConv, [512, 3, 2]]   # 5-P4/16
  - [-1, 2, C3Ghost, [512]]           # 6
  - [-1, 1, GhostConv, [1024, 3, 2]]  # 7-P5/32
  - [-1, 3, C3TR, [1024, False]]      # 8
  - [-1, 1, SPPF, [1024, 5]]          # 9

# Head (Now with SimAM + WeightedConcat + HFIM)
head:
  # Top-Down Path
  - [-1, 1, nn.Upsample, [None, 2, "bilinear"]]  # 10
  - [[-1, 6], 1, WeightedConcat, [1]]           # 11
  - [-1, 2, C3Ghost, [512, False]]              # 12
  - [-1, 1, SimAM, [1e-4]]                      # 13

  - [-1, 1, nn.Upsample, [None, 2, "bilinear"]]  # 14
  - [[-1, 4], 1, WeightedConcat, [1]]           # 15
  - [-1, 2, C3Ghost, [256, False]]              # 16
  - [-1, 1, SimAM, [1e-4]]                      # 17

  # --- P2 EXTENSION (Tiny Object Head) ---
  - [-1, 1, nn.Upsample, [None, 2, "bilinear"]]  # 18
  - [[-1, 1], 1, WeightedConcat, [1]]           # 19
  
  # Innovation: HFIM (Inject High Frequency Edges here for P2)
  - [-1, 1, HFIM, [128]]                        # 20
  
  - [-1, 2, C3Ghost, [128, False]]              # 21 (P2 - High Res)

  # Bottom-Up Path
  - [-1, 1, GhostConv, [128, 3, 2]]             # 22
  - [[-1, 17], 1, WeightedConcat, [1]]          # 23
  - [-1, 2, C3Ghost, [256, False]]              # 24
  - [-1, 1, SimAM, [1e-4]]                      # 25 (P3)

  - [-1, 1, GhostConv, [256, 3, 2]]             # 26
  - [[-1, 13], 1, WeightedConcat, [1]]          # 27
  - [-1, 2, C3Ghost, [512, False]]              # 28
  - [-1, 1, SimAM, [1e-4]]                      # 29 (P4)

  - [-1, 1, GhostConv, [512, 3, 2]]             # 30
  - [[-1, 9], 1, WeightedConcat, [1]]           # 31
  - [-1, 2, C3TR, [1024, False]]                # 32 (P5)

  # Detect
  - [[21, 25, 29, 32], 1, Detect, [nc]]         # 33: Detect(P2, P3, P4, P5)

  # Aux Branch (Training Only) - From P3 (Layer 25)
  - [25, 1, Conv, [256, 3, 1]]                  # 34
  - [-1, 1, Conv, [3, 1, 1, None, 1, 1, False]] # 35
  - [-1, 1, nn.Upsample, [None, 8, 'bilinear']]  # 36
  - [-1, 1, nn.Sigmoid, []]                     # 37
